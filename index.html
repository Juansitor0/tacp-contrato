<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TACP v3.0">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1182/1182761.png">
    <title>TACP v3.0 | Notificações Ativas</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1182/1182761.png">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: #161b22;
            --neon-blue: #00d2ff;
            --matrix-green: #00ff41;
            --alert-red: #ff3131;
            --text-gray: #8b949e;
            --text-white: #c9d1d9;
            --warning-yellow: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; overflow-x: hidden;
        }
        #login-screen {
            width: 90%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--neon-blue);
            padding: 30px; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); text-align: center; margin-top: 50px;
        }
        .btn-google {
            width: 100%; padding: 15px; background: white; border: none;
            color: #444; cursor: pointer; font-weight: bold; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            border-radius: 4px; transition: 0.3s;
        }
        .btn-google:hover { background: #f1f1f1; }
        .btn-google img { width: 20px; }
        #dashboard {
            display: none; width: 100%; max-width: 850px; background: var(--card-bg); border: 1px solid var(--neon-blue);
            padding: 15px; flex-direction: column; gap: 15px; min-height: 100vh;
        }
        @media (min-width: 768px) { #dashboard { margin: 20px auto; border-radius: 8px; min-height: auto; padding: 25px; width: 95%; } }
        header { border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; contain: layout; }
        h1 { color: var(--neon-blue); font-size: 1.3rem; margin: 0; text-transform: uppercase; }
        .system-status { font-size: 0.7rem; text-align: right; flex-grow: 1; line-height: 1.4; }
        .user-info-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; font-size: 0.75rem; border: 1px solid #30363d; }
        .main-grid { display: grid; grid-template-columns: 1fr; gap: 15px; will-change: transform; }
        @media (min-width: 768px) { .main-grid { grid-template-columns: 1.2fr 0.8fr; } }
        
        /* Pet Section Styles */
        .pet-section { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--neon-blue); border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .pet-container { width: 100%; height: 200px; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(0,210,255,0.05) 0%, rgba(0,0,0,0) 70%); }
        
        /* Wolf Sprite Logic */
        .wolf-sprite {
            width: 128px; height: 128px;
            background-image: url('assets/images/wolf_spritesheet.jpg');
            background-size: 512px 128px; /* 4 frames de 128px */
            image-rendering: pixelated;
            transition: transform 0.3s;
        }
        /* Poses baseadas no background-position */
        .wolf-idle { background-position: 0px 0px; animation: wolf-breathe 2s infinite ease-in-out; }
        .wolf-sit { background-position: -128px 0px; }
        .wolf-happy { background-position: -256px 0px; animation: wolf-wag 0.2s infinite alternate; }
        .wolf-tilt { background-position: -384px 0px; }

        @keyframes wolf-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes wolf-wag { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

        .pet-stats { width: 100%; display: flex; justify-content: space-around; margin-top: 10px; font-size: 0.65rem; color: var(--text-gray); }
        .pet-stat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .pet-bar-bg { width: 100%; max-width: 60px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; border: 1px solid #444; }
        .pet-bar-fill { height: 100%; width: 100%; transition: width 0.5s, background 0.5s; }
        
        .pet-level-badge { position: absolute; top: 10px; left: 10px; background: var(--neon-blue); color: black; padding: 2px 8px; border-radius: 10px; font-size: 0.6rem; font-weight: bold; z-index: 15; box-shadow: 0 0 10px var(--neon-blue); }
        .pet-actions { display: flex; gap: 8px; margin-top: 15px; width: 100%; flex-wrap: wrap; }
        .btn-pet { flex: 1; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; }
        .btn-pet:active { transform: scale(0.95); background: var(--neon-blue); color: black; }
        
        .heart-particle { position: absolute; pointer-events: none; font-size: 20px; animation: heart-float 1.5s forwards ease-out; z-index: 100; }
        @keyframes heart-float { 0% { transform: translateY(0) scale(0); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
        
        .pet-bubble { position: absolute; top: 10px; right: 10px; background: white; color: black; padding: 5px 10px; border-radius: 10px; font-size: 0.6rem; font-weight: bold; display: none; z-index: 20; }
        .pet-bubble::after { content: ''; position: absolute; bottom: -5px; left: 10px; border-width: 5px 5px 0; border-style: solid; border-color: white transparent; }

        /* Outros estilos do dashboard omitidos para brevidade, mas mantidos no arquivo real */
        .music-section { background: rgba(0, 0, 0, 0.3); border: 1px solid #30363d; border-radius: 4px; padding: 15px; margin-top: 15px; }
        .music-header { color: var(--neon-blue); font-size: 0.9rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .music-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .music-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid #30363d; padding: 10px; color: white; border-radius: 4px; font-family: inherit; font-size: 0.8rem; }
        .btn-music { background: transparent; border: 1px solid var(--matrix-green); color: var(--matrix-green); padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 0.8rem; }
        .spotify-embed { width: 100%; border-radius: 12px; border: none; height: 152px; }
        .minecraft-font { font-family: 'Courier New', Courier, monospace; font-weight: bold; letter-spacing: 1px; }
        .metric-card-graph { background: rgba(0, 0, 0, 0.3); border: 1px solid #30363d; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .chart-container { position: relative; height: 280px; width: 100%; max-width: 400px; }
        .expandable-section { background: rgba(0, 0, 0, 0.3); border: 1px solid #30363d; border-radius: 4px; overflow: hidden; }
        .expandable-header { padding: 12px; background: rgba(0, 0, 0, 0.5); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
        .expandable-content { max-height: 0; overflow: hidden; transition: 0.3s; }
        .expandable-section.expanded .expandable-content { max-height: 600px; padding: 15px; }
        .status-control { margin-bottom: 15px; }
        .status-label-row { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 8px; color: var(--text-gray); }
        .status-slider { width: 100%; height: 25px; accent-color: var(--neon-blue); cursor: pointer; }
        .clauses { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; width: 100%; }
        .clause-item { background: rgba(255, 255, 255, 0.03); border-left: 4px solid var(--neon-blue); padding: 15px; display: flex; align-items: flex-start; cursor: pointer; border-radius: 0 4px 4px 0; }
        #btn-deploy { width: 100%; padding: 18px; border: 2px solid var(--neon-blue); background: transparent; color: var(--neon-blue); font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        #chat-widget { position: fixed; bottom: 15px; right: 15px; z-index: 2000; display: none; flex-direction: column; align-items: flex-end; }
        #chat-button { width: 55px; height: 55px; border-radius: 50%; background: var(--neon-blue); border: none; cursor: pointer; box-shadow: 0 0 15px var(--neon-blue); display: flex; justify-content: center; align-items: center; font-size: 1.6rem; color: black; }
        #chat-window { width: 280px; height: 380px; background: var(--card-bg); border: 1px solid var(--neon-blue); border-radius: 8px; margin-bottom: 10px; display: none; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden; }
        .chat-header { padding: 10px; background: rgba(0,0,0,0.5); border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot-online { background: var(--matrix-green); box-shadow: 0 0 5px var(--matrix-green); }
        .dot-offline { background: #555; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; }
        .msg { padding: 8px 12px; border-radius: 4px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--neon-blue); }
        .msg-them { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid #30363d; }
        .chat-input-area { display: flex; border-top: 1px solid #30363d; padding: 5px; }
        #chat-input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-family: inherit; font-size: 1rem; }
        .btn-send { background: transparent; border: none; color: var(--matrix-green); cursor: pointer; font-weight: bold; padding: 0 10px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 15px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--neon-blue); width: 100%; max-width: 500px; border-radius: 8px; padding: 20px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="login-screen">
        <h2 style="color: var(--neon-blue); letter-spacing: 2px;">TACP ACCESS</h2>
        <p style="font-size: 0.8rem; color: var(--text-gray); margin-bottom: 25px;">Acesso restrito aos contratantes oficiais.</p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            ENTRAR COM GOOGLE
        </button>
        <p id="login-error" style="color: var(--alert-red); font-size: 0.75rem; margin-top: 15px; display: none;"></p>
    </div>

    <div id="dashboard">
        <header>
            <div>
                <h1>Contrato 2026</h1>
                <div style="font-size: 0.6rem; color: var(--text-gray);">STATUS: ENCRYPTED | REAL-TIME</div>
            </div>
            <div class="system-status">
                <div>UPTIME: <span id="uptime-val">00:00:00</span></div>
            </div>
        </header>
        <div class="user-info-bar">
            <span>SESSÃO: <span id="display-user" style="color: var(--neon-blue); font-weight: bold;">---</span></span>
            <button onclick="handleLogout()" style="background:none; border:1px solid var(--alert-red); color:var(--alert-red); font-size:0.7rem; cursor:pointer; padding:4px 8px; border-radius:3px;">LOGOUT</button>
        </div>
        <div class="main-grid">
            <div class="metric-card-graph">
                <!-- Pet Section -->
                <div class="pet-section" id="pet-section">
                    <div class="pet-bubble" id="pet-bubble">Au au! ❤️</div>
                    <div class="pet-container" onclick="petInteraction('carinho')">
                        <div id="wolf-sprite" class="wolf-sprite wolf-idle"></div>
                    </div>
                    <div class="pet-stats">
                        <div class="pet-stat-item">
                            <span>FOME</span>
                            <div class="pet-bar-bg"><div id="bar-fome" class="pet-bar-fill"></div></div>
                        </div>
                        <div class="pet-stat-item">
                            <span>HUMOR</span>
                            <div class="pet-bar-bg"><div id="bar-humor" class="pet-bar-fill"></div></div>
                        </div>
                    </div>
                    <div class="pet-actions">
                        <button class="btn-pet" onclick="petInteraction('alimentar')">🦴 COMER</button>
                        <button class="btn-pet" onclick="petInteraction('carinho')">❤️ AMAR</button>
                        <button class="btn-pet" id="btn-sono" onclick="petInteraction('sono')">💤 SONO</button>
                    </div>
                    <div id="pet-info" style="font-size: 0.5rem; color: var(--text-gray); margin-top: 10px; text-align: center;">
                        Última interação por: <span id="pet-last-user" style="color: var(--neon-blue);">---</span>
                    </div>
                </div>

                <span style="font-size: 0.65rem; color: var(--text-gray); text-transform: uppercase; margin-bottom: 5px;">Biometria Emocional</span>
                <div class="chart-container"><canvas id="radarChart"></canvas></div>
                
                <!-- Music Section -->
                <div class="music-section" style="width: 100%; margin-top: 20px;">
                    <div class="music-header">
                        <span style="font-size: 1.2rem;">🎵</span> <span class="minecraft-font">SINTONIZADOS</span>
                    </div>
                    <div class="music-input-group">
                        <input type="text" id="spotify-link" class="music-input" placeholder="Link do Spotify..." onkeypress="if(event.key==='Enter') shareMusic()">
                        <button class="btn-music" onclick="shareMusic()">ENVIAR</button>
                    </div>
                    <div id="spotify-player-container"></div>
                </div>
            </div>
            <div>
                <div class="expandable-section expanded">
                    <div class="expandable-header"><span>MEUS STATUS</span><span>▼</span></div>
                    <div class="expandable-content">
                        <div class="status-control"><div class="status-label-row"><span>FOME </span><span id="val-0">50%</span></div><input type="range" class="status-slider" data-index="0" min="0" max="100"></div>
                        <div class="status-control"><div class="status-label-row"><span>PACIÊNCIA </span><span id="val-1">50%</span></div><input type="range" class="status-slider" data-index="1" min="0" max="100"></div>
                        <div class="status-control"><div class="status-label-row"><span>TRISTEZA </span><span id="val-2">50%</span></div><input type="range" class="status-slider" data-index="2" min="0" max="100"></div>
                        <div class="status-control"><div class="status-label-row"><span>FELICIDADE </span><span id="val-3">50%</span></div><input type="range" class="status-slider" data-index="3" min="0" max="100"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="clauses" id="clauses-container"></div>
        <button id="btn-deploy" disabled>ASSINAR CONTRATO</button>
    </div>

    <div id="chat-widget">
        <div id="chat-window">
            <div class="chat-header">
                <div style="display:flex; gap:10px;">
                    <div><span id="dot-juan" class="dot dot-offline"></span> JUAN</div>
                    <div><span id="dot-mici" class="dot dot-offline"></span> MICI</div>
                </div>
                <span onclick="toggleChat()" style="cursor:pointer;">X</span>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Mensagem..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">></button>
            </div>
        </div>
        <button id="chat-button" onclick="toggleChat()">💬</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDeXp1gHm2cyd0MPRbyj7NMm0HlnlI9tCE",
            authDomain: "contrato-online.firebaseapp.com",
            databaseURL: "https://contrato-online-default-rtdb.firebaseio.com",
            projectId: "contrato-online",
            storageBucket: "contrato-online.firebasestorage.app",
            messagingSenderId: "707541071284",
            appId: "1:707541071284:web:6bc61a769477e24feeaee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let state = { 
            currentUser: null, 
            biometria: { juan: [50,50,50,50], mici: [50,50,50,50] }, 
            checkboxes: {},
            pet: { ultimo_almoco: Date.now(), ultimo_carinho: Date.now(), dormindo: false, quem_interagiu: '---' }
        };

        let chart;
        let syncingFromFirebase = false;

        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { await auth.signInWithPopup(provider); } catch (e) { console.error(e); }
        }

        async function handleLogout() {
            if (state.currentUser) await db.ref(`presence/${state.currentUser}`).set('offline');
            auth.signOut().then(() => window.location.reload());
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                const email = user.email.toLowerCase();
                state.currentUser = (email.includes('juan') || email.includes('juansitor')) ? 'juan' : 'mici';
                document.getElementById('display-user').innerText = state.currentUser.toUpperCase();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
                document.getElementById('chat-widget').style.display = 'flex';
                initSystem();
            } else {
                document.getElementById('login-screen').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        function initSystem() {
            db.ref('tacp_contract').on('value', snap => {
                if (!snap.exists()) return;
                syncingFromFirebase = true;
                const data = snap.val();
                state.biometria = data.biometria || state.biometria;
                state.pet = data.pet || state.pet;
                updatePetUI();
                updateChart();
                syncSliders();
                syncingFromFirebase = false;
            });

            db.ref('chat').on('child_added', snap => {
                const m = snap.val();
                const container = document.getElementById('chat-messages');
                const div = document.createElement('div');
                div.className = `msg ${m.user === state.currentUser ? 'msg-me' : 'msg-them'}`;
                div.innerHTML = `<span style="font-size:0.6rem; font-weight:bold; display:block; color:var(--neon-blue);">${m.user.toUpperCase()}</span>${m.text}`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            });
            initRadar();
        }

        function updatePetUI() {
            const now = Date.now();
            const hoursFood = (now - state.pet.ultimo_almoco) / 3600000;
            const hoursLove = (now - state.pet.ultimo_carinho) / 3600000;
            const fome = Math.max(0, 100 - (hoursFood * 10));
            const humor = Math.max(0, 100 - (hoursLove * 15));

            document.getElementById('bar-fome').style.width = fome + '%';
            document.getElementById('bar-humor').style.width = humor + '%';
            document.getElementById('pet-last-user').innerText = state.pet.quem_interagiu.toUpperCase();
            
            const wolf = document.getElementById('wolf-sprite');
            wolf.className = 'wolf-sprite';
            if (state.pet.dormindo) {
                wolf.classList.add('wolf-sit');
            } else if (humor > 80) {
                wolf.classList.add('wolf-happy');
            } else if (fome < 30) {
                wolf.classList.add('wolf-tilt');
            } else {
                wolf.classList.add('wolf-idle');
            }
            document.getElementById('btn-sono').innerText = state.pet.dormindo ? '☀️ ACORDAR' : '💤 SONO';
        }

        function petInteraction(type) {
            const now = Date.now();
            if (state.pet.dormindo && type !== 'sono') {
                showBubble("Zzz..."); return;
            }

            if (type === 'alimentar') {
                state.pet.ultimo_almoco = now;
                showBubble("Nhac! 🦴");
                new Audio('assets/audio/eat.mp3').play().catch(()=>{});
            } else if (type === 'carinho') {
                state.pet.ultimo_carinho = now;
                showBubble("Au au! ❤️");
                new Audio('assets/audio/bark.mp3').play().catch(()=>{});
                createHearts();
            } else if (type === 'sono') {
                state.pet.dormindo = !state.pet.dormindo;
            }
            state.pet.quem_interagiu = state.currentUser;
            save();
            updatePetUI();
        }

        function showBubble(text) {
            const b = document.getElementById('pet-bubble');
            b.innerText = text; b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 2000);
        }

        function createHearts() {
            const c = document.getElementById('pet-section');
            for(let i=0; i<5; i++) {
                const h = document.createElement('div');
                h.className = 'heart-particle'; h.innerHTML = '❤️';
                h.style.left = (40 + Math.random()*20) + '%'; h.style.top = '40%';
                c.appendChild(h); setTimeout(() => h.remove(), 1500);
            }
        }

        function save() {
            if (syncingFromFirebase) return;
            db.ref('tacp_contract').update({ biometria: state.biometria, pet: state.pet });
        }

        function initRadar() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Fome', 'Paciência', 'Tristeza', 'Felicidade'],
                    datasets: [
                        { label: 'Juan', data: state.biometria.juan, borderColor: '#00ff41', backgroundColor: 'rgba(0,255,65,0.1)' },
                        { label: 'Mici', data: state.biometria.mici, borderColor: '#00d2ff', backgroundColor: 'rgba(0,210,255,0.1)' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { r: { grid: { color: '#333' }, ticks: { display: false }, pointLabels: { color: '#8b949e' } } },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }

        function updateChart() { if(chart) { chart.data.datasets[0].data = state.biometria.juan; chart.data.datasets[1].data = state.biometria.mici; chart.update(); } }
        function syncSliders() {
            state.biometria[state.currentUser].forEach((v, i) => {
                const s = document.querySelector(`.status-slider[data-index="${i}"]`);
                if(s) s.value = v;
                document.getElementById(`val-${i}`).innerText = v + "%";
            });
        }

        document.querySelectorAll('.status-slider').forEach(s => {
            s.addEventListener('input', e => {
                const i = e.target.dataset.index;
                const v = parseInt(e.target.value);
                state.biometria[state.currentUser][i] = v;
                document.getElementById(`val-${i}`).innerText = v + "%";
                updateChart(); save();
            });
        });

        function toggleChat() { const w = document.getElementById('chat-window'); w.style.display = w.style.display === 'flex' ? 'none' : 'flex'; }
        function sendMessage() {
            const i = document.getElementById('chat-input');
            if (i.value.trim()) {
                db.ref('chat').push({ user: state.currentUser, text: i.value, time: Date.now() });
                i.value = '';
            }
        }
        function shareMusic() { const l = document.getElementById('spotify-link').value; if(l) { db.ref('tacp_contract').update({ currentMusic: l }); } }
        let sec = 0; setInterval(() => { sec++; let h=Math.floor(sec/3600).toString().padStart(2,'0'), m=Math.floor((sec%3600)/60).toString().padStart(2,'0'), s=(sec%60).toString().padStart(2,'0'); document.getElementById('uptime-val').innerText = `${h}:${m}:${s}`; }, 1000);
    </script>
</body>
</html>
